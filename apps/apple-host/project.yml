# Nativer Apple-Host (ADR-019, CHAOS-139): eine App für macOS und tvOS. Erst ./prepare.sh, dann `xcodegen generate`.
name: ChaosHost
options:
  bundleIdPrefix: dev.rubeen
  deploymentTarget:
    macOS: '26.0'
    tvOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    # Nur für lokale Builds; Releases bekommen ihre Version von semantic-release (CHAOS-156).
    MARKETING_VERSION: '0.1'
    CURRENT_PROJECT_VERSION: '1'
    # Sparkle-Feed der Mac-App (CHAOS-156). Den öffentlichen EdDSA-Schlüssel setzt release-macos.sh aus der
    # Repository-Variable SPARKLE_PUBLIC_ED_KEY; ohne ihn bleibt der Updater aus (lokale Builds, PR-CI).
    SPARKLE_FEED_URL: https://github.com/rubenvitt/chaos-party/releases/download/macos-appcast/appcast.xml
    SPARKLE_PUBLIC_ED_KEY: ''
# Sparkle 2 (MIT, CHAOS-156): automatische Updates der Mac-App. Binär-Paket, die Prüfsumme steht im
# Package.swift des Tags; Version bewusst fest, Updates per Hand nach Blick ins CHANGELOG.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  ChaosHost:
    type: application
    supportedDestinations: [macOS, tvOS]
    sources:
      - path: app
      # Von prepare.sh erzeugt (nicht eingecheckt); als Ordner ins Bundle, damit controller/assets/… erhalten bleibt.
      - path: payload
        type: folder
        buildPhase: resources
        optional: true
      # tvOS-Icons und Top-Shelf-Bilder für TestFlight (CHAOS-119/151, scripts/tv-icons.py).
      - path: app-tv/Assets.xcassets
        destinationFilters: [tvOS]
      # Lizenz von Sparkle, das nur die Mac-App enthält (CHAOS-156).
      - path: licenses/Sparkle-LICENSE.txt
        buildPhase: resources
        destinationFilters: [macOS]
    dependencies:
      - package: Sparkle
        destinationFilters: [macOS]
    settings:
      base:
        PRODUCT_NAME: ChaosHost
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.chaosparty.host
        GENERATE_INFOPLIST_FILE: YES
        # Sparkle-Schlüssel (SUFeedURL, SUPublicEDKey …) gibt es nur am Mac; Xcode mischt sie in das erzeugte Info.plist.
        'INFOPLIST_FILE[sdk=macosx*]': config/Info-macOS.plist
        INFOPLIST_KEY_CFBundleDisplayName: Chaos Party
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Controller im lokalen Netz verbinden sich mit diesem Gerät.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '3'
        'ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletvos*]': 'App Icon & Top Shelf Image'
        'ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletvsimulator*]': 'App Icon & Top Shelf Image'
        # Nur Standard-Verschlüsselung des Systems: keine Exportfrage bei jedem TestFlight-Upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Nur lokal signieren: macOS ad hoc, Simulator ohne Team; echte Geräte bekommen das Team auf der Kommandozeile.
        # Signierte Mac-App mit Notarisierung: scripts/release-macos.sh (CHAOS-118); TestFlight für tvOS
        # (scripts/testflight.sh, CHAOS-151) setzt Bundle-ID dev.rubeen.chaosparty.tv, Team und Signatur auf der Kommandozeile.
        # Hardened Runtime immer am Mac, damit jeder lokale und CI-Build so läuft wie die notarisierte App
        # (JavaScriptCore ohne JIT-Berechtigung, ADR-019 §7; geprüft mit `ChaosHost --selftest`).
        'ENABLE_HARDENED_RUNTIME[sdk=macosx*]': YES
        # Ad hoc signiert lädt die App unter macOS 27 das ad hoc signierte Sparkle.framework nur ohne Library
        # Validation (CHAOS-176). Die Datei enthält nur disable-library-validation, keine JIT-Berechtigung;
        # release-macos.sh lässt sie für das Developer-ID-Release weg und prüft das.
        'CODE_SIGN_ENTITLEMENTS[sdk=macosx*]': config/ChaosHost-adhoc.entitlements
        # Das Mehrplattform-Ziel erbt den iOS/tvOS-Suchpfad @executable_path/Frameworks; am Mac liegen eingebettete
        # Frameworks (Sparkle, CHAOS-156) in Contents/Frameworks, sonst bricht dyld beim Start ab.
        'LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]': '$(inherited) @executable_path/../Frameworks'
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: '-'
        DEVELOPMENT_TEAM: ''
        'CODE_SIGNING_ALLOWED[sdk=appletvsimulator*]': NO
  # Mac-App für TestFlight bzw. den Mac App Store (CHAOS-200): gleicher Code ohne Sparkle (der App Store aktualisiert
  # selbst und lehnt Selbst-Updater ab), mit App Sandbox, Kategorie und Mac-Icon. Bundle-ID wie die Apple-TV-App, damit
  # beide ein App-Eintrag „Chaos Party Host“ in App Store Connect sind (Universal Purchase). Signatur und Upload:
  # scripts/testflight-macos.sh. Der Developer-ID-Kanal (Ziel ChaosHost, release-macos.sh) bleibt davon unberührt.
  ChaosHostAppStore:
    type: application
    platform: macOS
    sources:
      - path: app
      - path: payload
        type: folder
        buildPhase: resources
        optional: true
      # Mac-Icon (scripts/mac-icons.py), Pflicht im Mac App Store.
      - path: app-mac/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Chaos Party
        PRODUCT_MODULE_NAME: ChaosHost
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.chaosparty.tv
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chaos Party
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Controller im lokalen Netz verbinden sich mit diesem Gerät.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.board-games
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Schaltet Sparkle (Updates.swift) und seine Prüfung im Selbsttest ab.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APP_STORE
        CODE_SIGN_ENTITLEMENTS: config/ChaosHost-appstore.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/../Frameworks'
        # Lokal ad hoc; testflight-macos.sh setzt Team und Signatur auf der Kommandozeile.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: '-'
        DEVELOPMENT_TEAM: ''
