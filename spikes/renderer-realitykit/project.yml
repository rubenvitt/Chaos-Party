# CHAOS-78: Renderer-Spike RealityKit (macOS, iOS/iPadOS, tvOS). Erzeugen: `xcodegen generate`.
name: ChaosRenderSpike
options:
  bundleIdPrefix: dev.rubeen
  deploymentTarget:
    macOS: '26.0'
    iOS: '26.0'
    tvOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1'
    CURRENT_PROJECT_VERSION: '1'
targets:
  ChaosRenderSpike:
    type: application
    supportedDestinations: [macOS, iOS, tvOS]
    sources:
      - path: app
      # Testszene aus dem USDZ-Export als Ordner im Bundle (nicht als .reality kompiliert).
      - path: assets/export
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_NAME: ChaosRenderSpike
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.chaosparty.renderspike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chaos Render-Spike
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: '1,2,3'
        # Nur lokal signieren: macOS ad hoc, Simulatoren ohne Team. TestFlight liefert seit CHAOS-151
        # den nativen Host (apps/apple-host), nicht mehr diesen Spike.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: '-'
        DEVELOPMENT_TEAM: ''
        'CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]': NO
        'CODE_SIGNING_ALLOWED[sdk=appletvsimulator*]': NO
