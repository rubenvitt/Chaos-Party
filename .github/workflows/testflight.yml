name: TestFlight

# Archiviert, signiert automatisch und lädt die Controller-App (iPhone/iPad, CHAOS-115) zu
# TestFlight hoch: bei jedem Push auf main, der apps/controller-ios ändert, dazu manuell.
# Aufbau wie in lichtung (testflight.yml): Xcode signiert über den App Store Connect API-Key
# (Rolle Admin, er legt Verteilungszertifikat und Profil selbst an). Der App-Eintrag für
# dev.rubeen.chaosparty.controller muss in App Store Connect existieren.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/controller-ios/**'
      - '.github/workflows/testflight.yml'
      - 'scripts/asc-certificates*.mjs'

# Ein Upload nach dem anderen; ein neuer Push wartet, statt einen laufenden abzubrechen.
concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    # macos-latest: App Store Connect verlangt ein aktuelles SDK.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - name: API-Key ablegen
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in APPLE_API_KEY APPLE_API_KEY_P8 APPLE_API_ISSUER; do
            [ -n "${!name}" ] || { echo "::error::Secret $name fehlt"; exit 1; }
          done
          # Das Secret enthält die .p8 im Klartext (wie bei lichtung und zunder), nicht base64.
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          (umask 077; printf '%s\n' "$APPLE_API_KEY_P8" > "$key")
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
      # Apple erlaubt nur wenige Entwicklerzertifikate. Xcode legt beim Archivieren über den API-Key (Rolle Admin)
      # jedes Mal ein neues an; ohne Aufräumen scheitert der Lauf irgendwann an „maximum number of certificates“.
      # Darum vorher alle Entwicklerzertifikate widerrufen, die älter als zwei Stunden sind (jüngere könnten einem
      # parallelen Lauf gehören), und nach dem Lauf das neue (scripts/asc-certificates.mjs).
      - name: Alte Entwicklerzertifikate widerrufen
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/asc-certificates.mjs cleanup --snapshot "$RUNNER_TEMP/dev-certs.json"
      - name: Archivieren und hochladen
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
        run: apps/controller-ios/scripts/testflight.sh
      - name: Entwicklerzertifikat dieses Laufs widerrufen
        if: always() && env.ASC_KEY_PATH != ''
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/asc-certificates.mjs revoke-new --snapshot "$RUNNER_TEMP/dev-certs.json"
      - name: API-Key löschen
        if: always()
        run: rm -f "$ASC_KEY_PATH"
