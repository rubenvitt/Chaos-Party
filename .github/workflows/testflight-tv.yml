name: TestFlight (Apple TV)

# Archiviert, signiert automatisch und lädt die Apple-TV-App zu TestFlight hoch: den nativen
# Apple-Host (ADR-019, apps/apple-host) als „Chaos Party“ mit der Bundle-ID dev.rubeen.chaosparty.tv
# (CHAOS-151; bis dahin der RealityKit-Spike, CHAOS-119). Die App hostet die Partie allein und
# liefert den Browser-Controller selbst aus, ein Rechner im LAN ist nicht nötig.
#
# Läuft bei jedem Push auf main, der den Host oder etwas ändert, das in seiner Nutzlast steckt
# (JS-Kern bündelt apps/server, apps/host und packages/*; die App liefert apps/controller aus),
# dazu manuell. Signatur und Secrets wie bei der Controller-App (testflight.yml, CHAOS-115).
# Die Mac-App kommt signiert und notarisiert aus release-macos.yml (CHAOS-118).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/apple-host/**'
      - 'apps/server/src/**'
      - 'apps/host/src/**'
      - 'apps/controller/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/testflight-tv.yml'
      - '!**/*.md'
      - '!**/*.test.ts'
      - '!**/test/**'

# Ein Upload nach dem anderen; ein neuer Push wartet, statt einen laufenden abzubrechen.
concurrency:
  group: testflight-tv
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: Apple TV zu TestFlight
    # macos-latest: App Store Connect verlangt ein aktuelles SDK.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Werkzeuge
        run: |
          brew install xcodegen
          xcodebuild -version

      # Brett-Kulisse und Figuren als USDZ (CHAOS-140/142): prepare.sh bricht ohne sie ab, damit kein Build mit
      # Grundkörpern ausgeliefert wird. Blender als Python-Modul (bpy 5.3 nur für Python 3.13), Brett aus dem
      # Web-Host über Chromium.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: packages/assets/blender/requirements.txt

      - name: USDZ-Assets bauen
        env:
          BOARD_EXPORT_TIMEOUT: '900000'
          # Die RealityKit-Prüfung braucht Metal; auf den VM-Runnern nicht verlässlich. usd-core prüft trotzdem.
          RK_CHECK: '0'
        run: |
          python -m venv .venv-blender
          .venv-blender/bin/pip install -r packages/assets/blender/requirements.txt
          pnpm exec playwright install chromium
          BLENDER_PYTHON="$PWD/.venv-blender/bin/python" pnpm build:apple-assets

      # JS-Kern, Havok, Lizenztexte, Browser-Controller, Porträts und USDZ nach apps/apple-host/payload/.
      - name: Nutzlast bauen
        run: apps/apple-host/prepare.sh

      - name: API-Key ablegen
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in APPLE_API_KEY APPLE_API_KEY_P8 APPLE_API_ISSUER; do
            [ -n "${!name}" ] || { echo "::error::Secret $name fehlt"; exit 1; }
          done
          # Das Secret enthält die .p8 im Klartext (wie bei lichtung und zunder), nicht base64.
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          (umask 077; printf '%s\n' "$APPLE_API_KEY_P8" > "$key")
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Archivieren und hochladen
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          SKIP_PREPARE: '1'
        run: apps/apple-host/scripts/testflight.sh

      - name: API-Key löschen
        if: always()
        run: rm -f "$ASC_KEY_PATH"
