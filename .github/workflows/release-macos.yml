name: Release (Mac-App)

# Signierte, notarisierte Mac-App des nativen Hosts (ADR-019, CHAOS-118) als GitHub-Release
# `macos-v<Version>`: bei jedem Push auf main, der die App oder ihren JS-Kern ändert, dazu manuell, aber nur,
# wenn seit dem letzten Release ein `feat`-, `fix`- oder `perf`-Commit kam (semantic-release, CHAOS-156).
# Aufbau wie in lichtung (release-macos.sh): Developer-ID-Zertifikat aus Secrets in einen temporären
# Schlüsselbund, notarytool mit dem App Store Connect API-Key der TestFlight-Workflows, Heften, Zip.
# Version: semantic-release aus den Conventional Commits seit dem letzten Tag `macos-v…` (release.config.mjs;
# feat → 0.x+1.0, fix/perf → 0.x.y+1). Build-Nummer (CFBundleVersion, Sparkle vergleicht sie) ist die Laufnummer.
#
# Secrets: MACOS_CERTIFICATE_P12 (base64 der .p12 mit „Developer ID Application“ samt Schlüssel),
# MACOS_CERTIFICATE_PASSWORD, dazu APPLE_API_KEY, APPLE_API_KEY_P8, APPLE_API_ISSUER (wie TestFlight).
#
# Sparkle-Updates (CHAOS-156): Secret SPARKLE_ED_PRIVATE_KEY (privater EdDSA-Schlüssel aus `generate_keys -x`)
# und Repository-Variable SPARKLE_PUBLIC_ED_KEY (öffentlicher Schlüssel, landet als SUPublicEDKey in der App).
# Der Workflow signiert den Zip, schreibt eine signierte appcast.xml und legt sie an den festen Release
# `macos-appcast` (stabile Adresse für SUFeedURL). Fehlt eins von beiden, gibt es das Release ohne Feed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Die App bündelt Server, Host-Rolle, game-core, Minispiele und den Browser-Controller.
      - 'apps/apple-host/**'
      - 'apps/server/src/**'
      - 'apps/host/src/**'
      - 'apps/controller/**'
      - 'packages/**'
      - '.github/workflows/release-macos.yml'
      - '!**/*.md'
      - '!**/*.test.ts'

# Ein Release nach dem anderen; ein neuer Push wartet, statt einen laufenden abzubrechen.
concurrency:
  group: release-macos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Günstig unter Linux: Gibt es überhaupt etwas zu veröffentlichen? semantic-release im Probelauf, ohne Tag.
  version:
    name: Nächste Version bestimmen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.next.outputs.version }}
      notes: ${{ steps.next.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release braucht alle Commits und Tags seit dem letzten Release.
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: semantic-release (Probelauf)
        id: next
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node apps/apple-host/scripts/next-version.mjs --notes "$RUNNER_TEMP/notes.md"
          {
            echo "notes<<RELEASE_NOTES_EOF"
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Mac-App signieren, notarisieren, veröffentlichen
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Vorabversion, solange Minispiele im nativen Host Grundkörper zeichnen (CHAOS-144); danach auf 'false'.
      PRERELEASE: 'true'
      VERSION: ${{ needs.version.outputs.version }}
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
      SPARKLE_FEED_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/macos-appcast/appcast.xml
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Werkzeuge
        run: |
          brew install xcodegen
          xcodebuild -version

      # Brett-Kulisse und Figuren als USDZ (CHAOS-140/142): prepare.sh bricht ohne sie ab, damit kein Build mit
      # Grundkörpern ausgeliefert wird. Blender als Python-Modul (bpy 5.3 nur für Python 3.13), Brett aus dem
      # Web-Host über Chromium.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: packages/assets/blender/requirements.txt

      - name: USDZ-Assets bauen
        env:
          BOARD_EXPORT_TIMEOUT: '900000'
          # Die RealityKit-Prüfung braucht Metal; auf den VM-Runnern nicht verlässlich. usd-core prüft trotzdem.
          RK_CHECK: '0'
        run: |
          python -m venv .venv-blender
          .venv-blender/bin/pip install -r packages/assets/blender/requirements.txt
          pnpm exec playwright install chromium
          BLENDER_PYTHON="$PWD/.venv-blender/bin/python" pnpm build:apple-assets

      - name: Sparkle-Feed prüfen
        env:
          HAS_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
        run: |
          if [ -n "$SPARKLE_PUBLIC_ED_KEY" ] && [ "$HAS_SPARKLE_PRIVATE_KEY" = true ]; then
            echo "SPARKLE_FEED=true" >> "$GITHUB_ENV"
          elif [ -n "$SPARKLE_PUBLIC_ED_KEY" ]; then
            # Eine App mit Schlüssel, aber ohne signierten Feed fände nie ein Update: lieber abbrechen.
            echo "::error::Variable SPARKLE_PUBLIC_ED_KEY ist gesetzt, Secret SPARKLE_ED_PRIVATE_KEY fehlt"; exit 1
          else
            echo "::warning::Ohne SPARKLE_PUBLIC_ED_KEY und SPARKLE_ED_PRIVATE_KEY: Release ohne Sparkle-Updates (CHAOS-156)"
            echo "SPARKLE_FEED=false" >> "$GITHUB_ENV"
          fi
          echo "Version $VERSION (Build $GITHUB_RUN_NUMBER)"

      - name: Zertifikat und API-Key ablegen
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_KEY_P8 APPLE_API_ISSUER; do
            [ -n "${!name}" ] || { echo "::error::Secret $name fehlt"; exit 1; }
          done
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          (umask 077; printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12")
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # Zwischenzertifikate der Developer ID, falls die .p12 sie nicht enthält (Duplikate sind egal).
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" || true
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          echo "SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          # Das Secret enthält die .p8 im Klartext (wie bei TestFlight), nicht base64.
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          (umask 077; printf '%s\n' "$APPLE_API_KEY_P8" > "$key")
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Bauen, signieren, notarisieren
        id: build
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: apps/apple-host/scripts/release-macos.sh

      - name: GitHub-Release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.build.outputs.zip }}
          CHANGES: ${{ needs.version.outputs.notes }}
        run: |
          tag="macos-v$VERSION"
          files=("$ZIP" "$ZIP.sha256")
          echo "TAG=$tag" >> "$GITHUB_ENV"
          if gh release view "$tag" > /dev/null 2>&1; then
            # Wiederholter Lauf derselben Nummer: Dateien ersetzen.
            gh release upload "$tag" "${files[@]}" --clobber
            exit 0
          fi
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Nativer Host für den Mac (ADR-019): Die App hostet die Partie allein, iPhones und iPads sind Controller.

          - **Voraussetzung:** macOS 26, Mac und Controller im selben WLAN.
          - **Start:** Zip entpacken, „Chaos Party.app“ nach „Programme“ ziehen und öffnen. Signiert mit Developer ID und von Apple notarisiert.
          - **Erster Start:** macOS fragt nach dem lokalen Netzwerk bzw. eingehenden Verbindungen. Erlauben, sonst erreichen die Controller die App nicht.
          - **Mitspielen:** Mit dem iPhone den QR-Code scannen (Browser) oder die Controller-App aus TestFlight nutzen.
          - **Updates:** Die App sucht selbst nach neuen Versionen (Sparkle), sofort über „Chaos Party → Nach Updates suchen …“.
          - **Stand:** Vorabversion. Brett und Minispiele sind noch Grundkörper; die echte Grafik folgt.

          ## Änderungen

          NOTES
          # Notizen von semantic-release (Commits seit dem letzten Release); erste Zeile ist die Versionsüberschrift.
          printf '%s\n\n' "$(printf '%s\n' "$CHANGES" | sed '1{/^#/d;}')" >> "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<NOTES
          Quelltext dieses Builds: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }} (GPL-3.0). Lizenzhinweise liegen in der App unter \`Contents/Resources/payload/\`, die von Sparkle unter \`Contents/Resources/Sparkle-LICENSE.txt\`.
          NOTES
          gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" \
            --title "Chaos Party für macOS $VERSION" --notes-file "$RUNNER_TEMP/notes.md" ${flags[@]+"${flags[@]}"}

      # Erst nach dem Release: der Feed zeigt auf dessen Zip. Der private Schlüssel geht nur über stdin an
      # sign_update, nie in eine Datei oder ins Log.
      - name: Sparkle-Feed signieren und veröffentlichen
        if: env.SPARKLE_FEED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.build.outputs.zip }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          base="${{ github.server_url }}/${{ github.repository }}/releases"
          ZIP="$GITHUB_WORKSPACE/$ZIP" BUILD_NUMBER="$GITHUB_RUN_NUMBER" APPCAST="$RUNNER_TEMP/appcast.xml" \
            DOWNLOAD_URL="$base/download/$TAG/$(basename "$ZIP")" RELEASE_URL="$base/tag/$TAG" \
            apps/apple-host/scripts/sparkle-feed.sh

          feed_tag=macos-appcast
          if ! gh release view "$feed_tag" > /dev/null 2>&1; then
            gh release create "$feed_tag" --target "$GITHUB_SHA" --prerelease --title "Sparkle-Feed der Mac-App" \
              --notes "Feste Adresse für die automatischen Updates der Mac-App (CHAOS-156). Nicht löschen: installierte Apps lesen \`appcast.xml\` von hier. Die Apps selbst liegen an den Releases \`macos-v…\`."
          fi
          gh release upload "$feed_tag" "$RUNNER_TEMP/appcast.xml" --clobber
          echo "Feed: $SPARKLE_FEED_URL"

      - name: Schlüsselbund und API-Key löschen
        if: always()
        run: |
          [ -n "${SIGN_KEYCHAIN:-}" ] && security delete-keychain "$SIGN_KEYCHAIN" || true
          rm -f "${ASC_KEY_PATH:-}"
