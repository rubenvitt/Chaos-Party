# Hält die per Commit-SHA festgenagelten Actions aktuell (CHAOS-150).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Conventional Commits (CHAOS-156): „ci(deps): …“, löst keinen Mac-Release aus.
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
